<svg width="900" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#1a8cff" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#1a8cff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1a1a1a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#1a1a1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="900" height="160" fill="url(#bg)"/>
  <rect width="900" height="160" fill="url(#glow)"/>

  <!-- grid lines horizontal -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>

  <!-- grid lines vertical -->
  <line x1="180" y1="0" x2="180" y2="160" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="360" y1="0" x2="360" y2="160" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="540" y1="0" x2="540" y2="160" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="720" y1="0" x2="720" y2="160" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>

  <!-- blue accent dot left -->
  <circle cx="72" cy="80" r="2.5" fill="#1a8cff" opacity="0.7"/>
  <circle cx="72" cy="80" r="8" fill="#1a8cff" opacity="0.06"/>

  <!-- blue accent dot right -->
  <circle cx="828" cy="80" r="2.5" fill="#1a8cff" opacity="0.7"/>
  <circle cx="828" cy="80" r="8" fill="#1a8cff" opacity="0.06"/>

  <!-- name -->
  <text x="450" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="30" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.5">
    Gannaram Dhruv
  </text>

  <!-- divider -->
  <rect x="300" y="82" width="300" height="0.6" fill="url(#fade)"/>

  <!-- role line -->
  <text x="450" y="104" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
        font-size="11" fill="#1a8cff" text-anchor="middle" letter-spacing="3.5">
    AI ENGINEER · AGENTIC SYSTEMS · INDIC NLP
  </text>

  <!-- location -->
  <text x="450" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="11" fill="#3d3d3f" text-anchor="middle" letter-spacing="1.5">
    HYDERABAD · INDIA
  </text>
</svg>
